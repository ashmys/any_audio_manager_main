[plugin]

name="Any AudioManager"
description="Any AudioManager is a global plugin for managing any audiotype(Omni, 2D, and 3D) efficiently in Godot. It automatically create dictionary and cache, and can be called with simple function. 

How to use:
- Enable Plugins Either Through Project Settigns or Asset Store Tab then Plugins, The AudioManager scene will be AutoLoaded.
- Open AudioManager scene in folder addons/any_audio_manager.
- Click AudioManager Node
- Create New AudioLibrary
- Pick Audio Directory, then it will automatically index all of the audios(currently this format only: .wav, .ogg, .mp3, .flac, .opus) in the folder or child folder.
- Now you can use it on any script, just try this(if there is audio named "click" in your audio directory):
```gd
func _ready() -> void:
	AudioManager.play("click")
```
- Experiment with other settings in the AudioManager and have fun! 

list of functions: 

```gd
is_playing(key: StringName) -> bool

play_once(key: StringName, setting_index: int = -1, audio_setting: AudioSetting = null, bus: StringName = default_audio_bus[2], loop: bool = false) -> void

play(key: StringName, setting_index: int = -1, audio_setting: AudioSetting = null, bus: StringName = default_audio_bus[2], loop: bool = false) -> void

play_2d(key: StringName, pos: Vector2, setting_index: int = -1, audio_setting: AudioSetting = null, bus: StringName = default_audio_bus[2], loop: bool = false) -> void

play_3d(key: StringName, pos: Vector3, setting_index: int = -1, audio_setting: AudioSetting = null, bus: StringName = default_audio_bus[2], loop: bool = false) -> void

play_unique(key: StringName, setting_index: int = -1, audio_setting: AudioSetting = null, bus: StringName = default_audio_bus[1]) -> void

stop(key: StringName, count: int = 1, bus: StringName = &"") -> void

stop_2d(key: StringName, count: int = 1, pos: Vector2 = Vector2.ZERO, radius: float = 0.0, bus: StringName = &"") -> void

stop_3d(key: StringName, count: int = 1, pos: Vector3 = Vector3.ZERO, radius: float = 0.0, bus: StringName = &"") -> void

stop_bus(bus: StringName) -> void

stop_all() -> void
```

Or if you want to use audio setting or other things, you can modify the script, add wrapper function, and use the audio setting index :

```gd
_play(key: StringName, type: AudioType, pos: Variant, setting_index: int = -1, audio_setting: AudioSetting = null, bus: StringName = default_audio_bus[0], loop: bool = false) -> void

_stop(key: StringName, count: int = 1, type: AudioType = AudioType.ALL, pos: Variant = null, radius: float = 0.0, bus: StringName = &"") -> void
```

License is CC0, credit is appreciated but not required."
author="Astreda(ashmys)"
version="1.3.2"
script="setting.gd"
